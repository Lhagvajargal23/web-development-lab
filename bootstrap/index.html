<!DOCTYPE html>
<html lang="mn" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Зургийн цомог — Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --brand: #3498db; --brand-dark: #2878b0; }
    .btn-brand {
      --bs-btn-color: #fff;
      --bs-btn-bg: var(--brand);
      --bs-btn-border-color: var(--brand);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: var(--brand-dark);
      --bs-btn-hover-border-color: var(--brand-dark);
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: var(--brand-dark);
      --bs-btn-active-border-color: var(--brand-dark);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="#">Зургийн цомог</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Цэс нээх">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#gallery">Нүүр</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Холбоо барих</a></li>
        </ul>
        <button type="button" id="theme-toggle" class="btn btn-brand">Харанхуй горим</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h2 id="gallery">Gallery</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo1.jpg" class="card-img-top" alt="Уулын оройд мандаж буй нар">
          <div class="card-body">
            <h5 class="card-title">Нар мандалт</h5>
            <p class="card-text">Хэнтий, 2026</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo2.jpg" class="card-img-top" alt="Нуурын эрэг дээрх ганц мод">
          <div class="card-body">
            <h5 class="card-title">Нуурын эрэг</h5>
            <p class="card-text">Хөвсгөл, 2026</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo3.jpg" class="card-img-top" alt="Говийн элсэн манхан">
          <div class="card-body">
            <h5 class="card-title">Элсэн манхан</h5>
            <p class="card-text">Говь, 2025</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo4.jpg" class="card-img-top" alt="Хотын шөнийн гэрэл">
          <div class="card-body">
            <h5 class="card-title">Шөнийн хот</h5>
            <p class="card-text">Улаанбаатар, 2026</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo5.jpg" class="card-img-top" alt="Намрын шар навчтай ой">
          <div class="card-body">
            <h5 class="card-title">Намрын ой</h5>
            <p class="card-text">Тэрэлж, 2025</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="../img/photo6.jpg" class="card-img-top" alt="Цас бүрсэн нуруу">
          <div class="card-body">
            <h5 class="card-title">Өвлийн нуруу</h5>
            <p class="card-text">Алтай, 2026</p>
          </div>
        </div>
      </div>
    </div>

    <h2 class="mt-5" id="contact">Холбоо барих</h2>
    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Нэр</label>
        <input type="text" class="form-control" id="name" required minlength="2">
        <div class="invalid-feedback">Нэрээ оруулна уу.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Имэйл</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">Зөв имэйл хаяг оруулна уу.</div>
      </div>
      <button class="btn btn-brand" type="submit">Илгээх</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var root = document.documentElement;
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var dark = root.getAttribute('data-bs-theme') === 'dark';
      root.setAttribute('data-bs-theme', dark ? 'light' : 'dark');
      this.textContent = dark ? 'Харанхуй горим' : 'Цайвар горим';
    });
    document.querySelectorAll('.needs-validation').forEach(function (form) {
      form.addEventListener('submit', function (e) {
        if (!form.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
        form.classList.add('was-validated');
      });
    });
  </script>
</body>
</html>
